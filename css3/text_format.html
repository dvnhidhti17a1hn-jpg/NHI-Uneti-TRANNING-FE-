<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các thuộc tính định dạng text còn lại</title>
    <style type="text/css">
        .text{
            text-decoration:underline;
            text-transform:uppercase;
            text-indent: 15px;
        }/*gạch chân dưới*/
        /*.text{
            text-decoration-line: line-through;
        } gạch giữa*/
         /* overline : gạch trên*/
         .title{
            text-decoration: overline underline;
         }/*kết hợp nhiều kiểu gạch 1 lúc*/
    </style>
</head>
<body>
    <p class="text">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Veniam molestiae nisi atque adipisci numquam possimus ipsum magni officiis pariatur nesciunt sint reiciendis perspiciatis aperiam, ex omnis beatae neque eos sed!
    </p>
    <h2 class="title">
Unicode Academy
    </h2>
</body>
</html>
