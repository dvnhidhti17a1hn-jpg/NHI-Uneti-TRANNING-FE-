<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thuộc tính Font_size trong css</title>
    <style type="text/css">
        html{
            font-size:30px;
            color:deeppink;
        }
        body{
            font-size:20px;
        }
        .content{
            font-size: 18px;
        }
        .text{
            /*font-size: initial;
            color:inherit;*/
            font-size:1rem;
        }
        .text{
            font-size:unset;
        }
    </style>
</head>
<body>
    <div class="content">
    <p class="text">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Velit explicabo ullam iste quos, facere, vel in qui numquam nihil accusamus maiores sed vitae beatae. Esse vel molestias quia doloremque labore.
    </p>
    </div>
</body>
</html>
