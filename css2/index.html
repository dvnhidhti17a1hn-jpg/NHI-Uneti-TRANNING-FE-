<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>
    <link rel="stylesheet" href="css/style.css">
    <style type="text/css">
        .form-wrapper h2{
        border-bottom: 2px solid red;
        }
        .form-wrapper h2 span{
        border: 2px dashed green;
        border-bottom: 2px solid green;
        }
        .form-wrapper form{
            background-color: rgb(157, 232, 157);
        }
        .form-wrapper table lable{
            font-weight: bold;
            font-style: italic;
        }
        .form-wrapper table input{
            background:azure;
            border:1px solid red;
            width: 95%;
        }
        .form-wrapper table .btn-wrap{
            border-top: 1px solid green;
            text-align: center;
        }
        .form-wrapper table .btn-wrap button{
            background:green;
            color:white;
            border:0;
        }
        .form-wrapper table td{
            padding-top: 5px;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <h2>
            <span>ĐĂNG KÝ TÀI KHOẢN</span>
        </h2>
        <form action="">
        <table width="50%" border="0" cellspacing="10">
            <tr>
                <td>
                    <lable for="lblFullName">Họ và tên</lable><br/>
                    <input type="text" id="lblFullName" placeholder="họ và tên"/>
                </td>
                <td>
                    <lable for="lblEmail">Email</lable><br/>
                    <input type="text" id="lblEmail" placeholder="email"/>
                </td>
            </tr>
            <tr>
                <td>
                    <lable for="lblPhone">Số điện thoại</lable><br/>
                    <input type="number" id="lblPhone" placeholder="số điện thoại"/>
                </td>
                <td>
                    <lable for="lblPasWord">Mật khẩu</lable><br/>
                    <input type="text" id="lblPassWord" placeholder="mật khẩu"/>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="btn-wrap">
                    <button type="submit">Đăng ký</button>

                </td>
            </tr>

        </table>
        </form>

    </div><!--End .form-wrapper-->
    
</body>
</html>
